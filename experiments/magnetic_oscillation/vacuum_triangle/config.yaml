medium:
  type: vacuum
  dt: 1.0e-4

magnetic_field: true
waveform: sine
frequency_hz: 1_000_000
amplitude: 1.0           # arbitrary scale for magnetic drive
duration_s: 1.0
sampling_rate: 10000

# used in our proportional model
default_k: 1.0
mass: 1.0

output_dir: "output/magnetic_oscillation/vacuum_triangle"
