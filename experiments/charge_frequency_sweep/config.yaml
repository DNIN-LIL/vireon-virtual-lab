# Charge–Frequency Sweep (Vacuum)

# Medium: identical logic to plasma case; only difference is type=vacuum
medium:
  type: vacuum            # vacuum | plasma
  dt: 1.0e-4              # fallback dt if experiment doesn't set one
  electric_screening_mode: auto
  magnetic_drag_coeff: 0.0

# Sweep parameters
charges: [1e-6, 5e-6, 1e-5, 5e-5, 1e-4]     # Coulombs
frequencies: [1e4, 1e5, 5e5, 1e6]           # Hz

# Particle/system
mass: 1.0                                   # kg
default_k: 1.0                               # proportionality constant if used in logic

# Run control
duration_s: 1.0
sampling_rate: 10000                         # samples per second; dt ≈ 1/sampling_rate

# Environment/space (if your logic uses a grid)
grid_size: [1.0, 1.0, 1.0]
grid_points: 50

# Toggles
spin_direction: clockwise
charge_present: true
magnetic_field: false
oscillation_type: electric_oscillation
waveform: all                                # all | sine | square | triangle

# Output
output_dir: "output/charge_frequency_sweep"
output_fields:
  - force_vector
  - potential_map
  - gravimeter_signal
