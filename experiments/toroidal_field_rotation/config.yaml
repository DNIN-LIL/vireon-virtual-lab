medium: vacuum
dt: 1.0e-4

radius: 0.2             # ring radius (meters)
num_charges: 100        # sources on the ring
omega_rot: 1000.0       # ring angular speed (rad/s)

frequency_hz: 1.0e6     # drive frequency for the field model (Hz)
charge: 1.0e-6          # charge per source (C)
mass: 1.0               # test mass (kg)
default_k: 1.0

waveform: all           # sine | square | triangle | all
duration_s: 1.0
sampling_rate: 10000

output_dir: "output/toroidal_field_rotation"
