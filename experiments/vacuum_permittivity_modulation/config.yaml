medium: vacuum
dt: 1.0e-4

charge: 1.0e-6          # C
frequency_hz: 1.0e6     # Hz
mass: 1.0               # kg

epsilon_multipliers: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
default_k: 1.0

# optional run control (kept for parity)
duration_s: 1.0
sampling_rate: 10000

output_dir: "output/vacuum_permittivity_modulation"
