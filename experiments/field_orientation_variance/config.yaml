medium:
  type: vacuum
  dt: 1.0e-4

# Space grid (pick one style and use it in both configs + logic)
grid_size: 4                  # scalar edge length
# grid_size: [4.0, 4.0, 4.0]  # or vector form if your logic expects 3D

frequency: 1.0e6             # Hz (single drive)
charge: 1.0e-9               # C
mass: 1.0e-6                 # kg
mode: random                 # orientation selection mode
default_k: 1.0

# Optional run control
duration_s: 1.0
sampling_rate: 10000

output_dir: "output/field_orientation_variance"
