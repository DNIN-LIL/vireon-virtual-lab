# Core sweep params (lists can be edited at runtime via prompts)
charges: [1e-6, 2e-6, 5e-6]
frequencies: [1e3, 1e4, 1e5]

# Scalars
mass: 1.0
default_k: 1.0
duration_s: 1.0
sampling_rate: 20000

# Experiment-specific knobs (safe defaults; extra keys are ignored if unused)
orientation_angles_deg: [0, 15, 30, 45, 60, 75, 90]
field_strength: 1.0

# Use a relative path to avoid Windows ':' quoting problems
output_dir: output/field_orientation_variance
