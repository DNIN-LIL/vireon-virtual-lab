medium:
  type: plasma
  dt: 1.0e-4
  plasma_frequency: 1.2e6
  collision_freq: 3.0e4
  relative_permittivity: 2.5
  drive_frequency: null
  electric_screening_mode: auto
  electric_screening_fixed: 1.0
  magnetic_drag_coeff: 0.0

charge_present: true
magnetic_field: false
oscillation_type: electric_oscillation
waveform: sine

charges: [0.001, 0.001, 0.001]
frequencies: [1000000, 1000000, 1000000]
phase_offsets: [0, 120, 240]

mass: 1.0
default_k: 1.0
duration_s: 1.0
spin_direction: clockwise

grid_size: [1.0, 1.0, 1.0]
grid_points: 50
sampling_rate: 10000

output_dir: "output/interference_field_superposition_in_plasma"
output_fields:
  - force_vector
  - potential_map
  - gravimeter_signal
  - plasma_vorticity
