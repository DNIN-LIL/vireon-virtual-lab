medium: plasma
dt: 1.0e-4
plasma_frequency: 1.2e6          # rad/s
collision_freq: 3.0e4            # rad/s
relative_permittivity: 2.5
drive_frequency: null            # set at runtime from 'frequency' (see logic note below)
electric_screening_mode: auto
electric_screening_fixed: 1.0
magnetic_drag_coeff: 0.0

# Must match the vacuum config (same keys and shapes)
grid_size: 4                        # keep same style as vacuum (scalar or vector)
# grid_size: [4.0, 4.0, 4.0]

frequency: 1.0e6
charge: 1.0e-9
mass: 1.0e-6
mode: random
default_k: 1.0

duration_s: 1.0
sampling_rate: 10000

output_dir: "output/field_orientation_variance_in_plasma"
