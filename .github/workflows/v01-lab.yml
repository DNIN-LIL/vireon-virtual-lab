name: Build Vireon Lab
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # build on version tags too
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        shell: pwsh
        run: scripts/install.ps1

      - name: Smoke check (byte-compile)
        run: python -m compileall -q core experiments main.py

      - name: Pack lab zip (all experiments)
        shell: pwsh
        run: scripts/pack-lab.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vireon-lab
          path: |
            dist/vireon-lab.zip
            dist/vireon-lab.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vireon-lab
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vireon-lab.zip
            dist/vireon-lab.zip.sha256
